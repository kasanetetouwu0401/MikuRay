# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# 1. Memory & Garbage Collection
# Limit max RAM to 4GB to prevent OutOfMemory (OOM) errors on GitHub Runners.
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError

# 2. Github Runner Optimizations
# Disable daemon and file watching since CI runners are destroyed after completion.
org.gradle.daemon=false
org.gradle.vfs.watch=false
# Standard GitHub Actions only provide 2 vCPUs. Limit workers to avoid CPU thrashing.
org.gradle.workers.max=2

# 3. Caching & Performance
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true
# (Optional) Uncomment the line below if all plugins in your project support Gradle 8+
# org.gradle.configuration-cache=true

# 4. Kotlin Compiler Tweaks For Ci
# Disable incremental build because GitHub always starts from a fresh clone/cache.
kotlin.incremental=false
# Run the Kotlin compiler in the same process to save RAM.
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official

# 5. Android & Kapt
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false
android.nonFinalResIds=true

# Additional optimizations if your project uses KAPT (e.g., Room, Glide, Dagger)
kapt.use.worker.api=true
kapt.incremental.apt=false
kapt.include.compile.classpath=false
